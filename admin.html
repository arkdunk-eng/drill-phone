<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電話シミュレータ運営</title><link rel="stylesheet" href="css/admin.css"></head>
<body><main><h1>電話シミュレータ運営</h1><p>研修用の想定を管理します。</p><div id="error" role="alert"></div>
<section><h2>地域</h2><div id="regions"><button type="button" data-region="東部">東部</button><button type="button" data-region="中部">中部</button><button type="button" data-region="静岡市">静岡市</button><button type="button" data-region="西部">西部</button><button type="button" data-region="浜松市">浜松市</button></div><p class="note">選んだ地域の電話先だけが参加者の連絡先に並びます。1つも選ばなければ全部並びます。切り替えは参加者が画面を開き直すか、テーブルを選び直したときに効きます。</p></section>
<section><h2>場面</h2><div id="scenes"><button type="button" data-scene="1">1 被害が少ない</button><button type="button" data-scene="2">2 被害が局所的</button><button type="button" data-scene="3">3 被害が甚大</button></div><p>切り替えは次の発信から効きます。</p></section>
<div id="missing" role="alert" hidden></div>
<section><h2>通話記録</h2><p>合計の通話時間: <strong id="total">0分</strong></p><div class="scroll"><table><thead><tr><th>時刻（開始）</th><th>テーブル</th><th>電話先</th><th>場面</th><th>長さ</th><th>終わり方</th></tr></thead><tbody id="calls"></tbody></table></div><div id="detail"></div></section>
</main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script></body></html>
