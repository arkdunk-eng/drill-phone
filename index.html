<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>研修用電話</title><link rel="stylesheet" href="css/phone.css"></head>
<body><main id="app" class="shell">
  <header id="header"><button id="change-table" class="link" type="button">テーブルを変える</button><div class="header-row"><strong id="table-name">テーブル</strong><span class="badge">研修用</span></div></header>
  <p id="notice">研修用の電話です。会社名は実在しますが、被害や在庫の状況はすべて研修のための想定です。</p>
  <section id="table-view" class="view"><h1>テーブルを選ぶ</h1><div id="table-list" class="card"></div></section>
  <section id="contacts-view" class="view" hidden><div id="contacts-list"></div></section>
  <section id="history-view" class="view" hidden><h1>通話履歴</h1><div id="history-list" class="card"></div></section>
  <section id="detail-view" class="view" hidden><button id="back-history" class="link" type="button">‹ 通話履歴</button><h1 id="detail-title"></h1><div id="turns"></div></section>
  <nav id="tabs"><button id="tab-contacts" class="selected" type="button">連絡先</button><button id="tab-history" type="button">通話履歴</button></nav>
  <section id="call-view" hidden aria-live="polite"><div class="caller"><div id="avatar"></div><h1 id="call-name"></h1><p id="call-status">呼び出し中…</p></div><div class="call-controls"><div class="hang-wrap"><button id="hang" type="button" aria-label="切る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c0-4 4-7 9-7s9 3 9 7l-2 3-4-2v-3H9v3l-4 2z" fill="currentColor"/></svg></button><small>切る</small></div><button id="talk" type="button" disabled>話す</button></div></section>
  <div id="error" role="alert" hidden></div>
</main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/gate.js"></script><script src="js/audio.js"></script><script src="js/transcript.js"></script><script src="js/live.js"></script><script src="js/app.js"></script></body></html>
